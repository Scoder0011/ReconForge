name: dnsx
stage: 03_dns
description: "Resolve hosts and output A/AAAA/CNAME records for a list of subdomains"
binary: dnsx
check:
  command: "{binary} -version"
  success_returncode: 0
  timeout: 10
install:
  method: go
  command: "go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest"
  post_install: null
  manual_instructions: null
run:
  command: "{binary} -l {input_file} -json -o {out}"
  timeout: 600
output:
  format: jsonl
  parser: jsonl
requires_api_key: []
notes: "This tool reads a file of subdomains from {input_file} rather than a single target hostname."
