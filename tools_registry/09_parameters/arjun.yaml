name: arjun
stage: 09_parameters
description: "Bruteforce hidden GET and POST parameter names against a small URL sample"
binary: arjun
check:
  command: "{binary} --help"
  success_returncode: 0
  timeout: 10
install:
  method: pip
  command: "pip install arjun"
  timeout: 300
run:
  command: "{binary} -i {input_file} -oJ {out}"
  timeout: 300
output:
  format: jsonl
  parser: jsonl
requires_api_key: []
notes: "arjun sends many requests per host and is gated behind allow_active_scans. The stage caps the URL list to the first 50 deduplicated URLs to bound request volume."
