name: ffuf
stage: 10_content_discovery
description: "Fuzz common directories and file names against a live host"
binary: ffuf
check:
  command: "{binary} -h"
  success_returncode: 0
  timeout: 10
install:
  method: go
  command: "go install -v github.com/ffuf/ffuf/v2@latest"
  timeout: 300
run:
  command: "{binary} -u {target_url}/FUZZ -w {wordlist_path} -of json -o {out} -mc 200,204,301,302,307,401,403"
  timeout: 300
output:
  format: custom
  parser: ffuf_json
requires_api_key: []
notes: "ffuf is a quota-heavy content fuzzing tool and is gated behind allow_active_scans. It captures common existence codes, not just 200 OK."
