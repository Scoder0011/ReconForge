name: naabu
stage: 05_ports_infra
description: "Broad port scan for live IPs using a conservative top-port sweep"
binary_candidates: ["naabu"]
signature: "projectdiscovery"
check:
  command: "{binary} -version"
  success_returncode: 0
  timeout: 10
install:
  method: go
  command: "go install -v github.com/projectdiscovery/naabu/cmd/naabu@latest"
  post_install: null
  manual_instructions: null
run:
  command: "{binary} -l {input_file} -top-ports 100 -json -o {out}"
  timeout: 600
output:
  format: jsonl
  parser: jsonl
requires_api_key: []
notes: "naabu is a broad port-scan tool and is gated behind allow_active_scans. config/config.yaml may override the port range for a more exhaustive scan once the user explicitly wants to do that."
